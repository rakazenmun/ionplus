<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IonPlus Notifications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>IonPlus Alerts</h1>
        <p>Subscribe to receive automated email updates whenever a new announcement hits the Ion API.</p>
        <form action="/subscribe" method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit">Turn On Notifications</button>
        </form>
    </div>
</body>
</html>
