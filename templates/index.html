<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IonPlus Notifications</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            margin-bottom: 10px;
            color: #333333;
        }
        p {
            color: #666666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #003d80;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <h1>IonPlus</h1>
    <p>Subscribe to get instant email updates on new announcements.</p>
    <form id="subscribeForm">
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <button type="submit">Subscribe</button>
    </form>
    <div id="message"></div>
</div>

<script>
    document.getElementById('subscribeForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const emailInput = document.getElementById('email').value;
        const messageDiv = document.getElementById('message');

        try {
            const response = await fetch('https://rakazen.pythonanywhere.com/subscribe', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({ email: emailInput })
            });

            if (response.ok) {
                messageDiv.className = 'success';
                messageDiv.textContent = 'Subscribed successfully!';
                document.getElementById('email').value = '';
            } else {
                messageDiv.className = 'error';
                messageDiv.textContent = 'Failed to subscribe. Please try again.';
            }
        } catch (error) {
            messageDiv.className = 'error';
            messageDiv.textContent = 'Error connecting to server.';
        }
    });
</script>

</body>
</html>
